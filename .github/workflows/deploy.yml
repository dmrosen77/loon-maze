# Builds the game and publishes it to GitHub Pages on every push to main:
# https://dmrosen77.github.io/loon-maze/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Also allows running it by hand from the Actions tab.

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces one still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
