# Add this inside the loon-maze site's `server { ... }` block in nginx
# (/etc/nginx/sites-available/loon-maze), above `location /`, then run
# `nginx -t && systemctl reload nginx`. It passes the game's api/ requests to
# the score server. Cloudflare's CF-Connecting-IP header (the real visitor's
# address, used for rate limiting) is passed along automatically.

    # World high scores (loon-maze-scores service).
    location /api/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 4k;
    }
